# Déploiement GazFlow sur un VPS avec Coolify (ou « docker compose up -d »).
# Dans Coolify, les variables SERVICE_* sont générées automatiquement (mots de passe, domaine).
# Hors Coolify, renseignez-les dans un fichier .env (voir .env.example).
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      - SERVICE_FQDN_APP_3000
      - NODE_ENV=production
      - PORT=3000
      - AUTH_SECRET=${SERVICE_PASSWORD_64_AUTH}
      - DATABASE_URL=postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@db:5432/gazflow
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${SERVICE_USER_POSTGRES}
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - POSTGRES_DB=gazflow
    volumes:
      - gazflow-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d gazflow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gazflow-db:
